x-backend-image: &backend-image
  image: synapseflow-backend:latest
  build:
    context: ./backend
    dockerfile: ../docker/backend/Dockerfile
    args:
      UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
      PYTORCH_CPU_FIND_LINKS: ${PYTORCH_CPU_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu/}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapseflow-postgres
    environment:
      POSTGRES_USER: synapseflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseflow123}
      POSTGRES_DB: synapseflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - synapseflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapseflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapseflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - synapseflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  reranker:
    image: synapseflow-reranker:latest
    build:
      context: ./docker/reranker
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PYTORCH_CPU_FIND_LINKS: ${PYTORCH_CPU_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu/}
        TORCH_VERSION: ${TORCH_VERSION:-2.11.0+cpu}
    container_name: synapseflow-reranker
    environment:
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_USE_FP16=${RERANK_USE_FP16:-false}
      - RERANK_MODEL_LOAD_RETRIES=${RERANK_MODEL_LOAD_RETRIES:-10}
      - RERANK_MODEL_LOAD_RETRY_DELAY=${RERANK_MODEL_LOAD_RETRY_DELAY:-15}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HOME=/models/huggingface
      - HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-600}
      - HF_HUB_ETAG_TIMEOUT=${HF_HUB_ETAG_TIMEOUT:-60}
    ports:
      - "8012:8012"
    volumes:
      - reranker_models:/models/huggingface
    networks:
      - synapseflow-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 20m

  backend:
    <<: *backend-image
    container_name: synapseflow-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapseflow:${POSTGRES_PASSWORD:-synapseflow123}@postgres:5432/synapseflow
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DRAMATIQ_INDEXING_QUEUE=${DRAMATIQ_INDEXING_QUEUE:-indexing}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HOME=/app/.cache/huggingface
      - RERANK_ENABLED=${RERANK_ENABLED:-true}
      - RERANK_API_URL=${RERANK_API_URL:-http://reranker:8012/v1/rerank}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ENTERPRISE_SERVICE_TOKEN=${ENTERPRISE_SERVICE_TOKEN:-}
      - EMBED_FRONTEND_BASE_URL=${EMBED_FRONTEND_BASE_URL:-http://localhost:3000}
      - EMBED_TOKEN_EXPIRE_MINUTES=${EMBED_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_hf_cache:/app/.cache/huggingface
      - backend_previews:/app/previews
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      reranker:
        condition: service_healthy
    networks:
      - synapseflow-network
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  backend-worker:
    <<: *backend-image
    container_name: synapseflow-backend-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapseflow:${POSTGRES_PASSWORD:-synapseflow123}@postgres:5432/synapseflow
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DRAMATIQ_INDEXING_QUEUE=${DRAMATIQ_INDEXING_QUEUE:-indexing}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HOME=/app/.cache/huggingface
      - ENTERPRISE_SERVICE_TOKEN=${ENTERPRISE_SERVICE_TOKEN:-}
      - EMBED_FRONTEND_BASE_URL=${EMBED_FRONTEND_BASE_URL:-http://localhost:3000}
      - EMBED_TOKEN_EXPIRE_MINUTES=${EMBED_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_hf_cache:/app/.cache/huggingface
      - backend_previews:/app/previews
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synapseflow-network
    command:
      - sh
      - -c
      - uv run dramatiq app.workers.indexing_tasks --processes 1 --threads 1

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NPM_REGISTRY: ${SF_NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: synapseflow-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_ALLOWED_DEV_ORIGINS=${NEXT_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - synapseflow-network
    command: pnpm run dev

volumes:
  postgres_data:
  backend_venv:
  backend_hf_cache:
  backend_previews:
  redis_data:
  reranker_models:

networks:
  synapseflow-network:
    driver: bridge
