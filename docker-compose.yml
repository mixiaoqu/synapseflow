services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapseflow-postgres
    environment:
      POSTGRES_USER: synapseflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseflow123}
      POSTGRES_DB: synapseflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - synapseflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapseflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: synapseflow-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapseflow:${POSTGRES_PASSWORD:-synapseflow123}@postgres:5432/synapseflow
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://47.107.55.65:3000,http://47.107.55.65}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_previews:/app/previews
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synapseflow-network
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: synapseflow-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://47.107.55.65:8000}
      - NEXT_ALLOWED_DEV_ORIGINS=${NEXT_ALLOWED_DEV_ORIGINS:-47.107.55.65}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - synapseflow-network
    command: pnpm run dev

volumes:
  postgres_data:
  backend_previews:

networks:
  synapseflow-network:
    driver: bridge
