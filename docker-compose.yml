services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapseflow-postgres
    environment:
      POSTGRES_USER: synapseflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseflow123}
      POSTGRES_DB: synapseflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - synapseflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapseflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapseflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - synapseflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: synapseflow-backend:latest
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: synapseflow-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapseflow:${POSTGRES_PASSWORD:-synapseflow123}@postgres:5432/synapseflow
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DRAMATIQ_INDEXING_QUEUE=${DRAMATIQ_INDEXING_QUEUE:-indexing}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_previews:/app/previews
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synapseflow-network
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend-worker:
    image: synapseflow-backend:latest
    container_name: synapseflow-backend-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapseflow:${POSTGRES_PASSWORD:-synapseflow123}@postgres:5432/synapseflow
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DRAMATIQ_INDEXING_QUEUE=${DRAMATIQ_INDEXING_QUEUE:-indexing}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
    volumes:
      - ./backend:/app
      - backend_previews:/app/previews
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synapseflow-network
    command:
      - sh
      - -c
      - uv run dramatiq app.workers.indexing_tasks --processes 1 --threads 1

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NPM_REGISTRY: ${SF_NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: synapseflow-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_ALLOWED_DEV_ORIGINS=${NEXT_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - synapseflow-network
    command: pnpm run dev

volumes:
  postgres_data:
  backend_previews:
  redis_data:

networks:
  synapseflow-network:
    driver: bridge
