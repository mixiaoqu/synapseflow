services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      SF_NGINX_SERVER_NAME: ${SF_NGINX_SERVER_NAME:-_}
      SF_CLIENT_MAX_BODY_SIZE: ${SF_CLIENT_MAX_BODY_SIZE:-50m}
    ports:
      - ${SF_NGINX_BIND_HOST:-0.0.0.0}:${SF_NGINX_PORT:-80}:80
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - synapseflow-network
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapseflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-synapseflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - synapseflow-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-synapseflow} -d ${POSTGRES_DB:-synapseflow}
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - synapseflow-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  reranker:
    image: synapseflow-reranker:prod
    build:
      context: ./docker/reranker
      args:
        PIP_INDEX_URL: ${SF_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PYTORCH_CPU_FIND_LINKS: ${SF_PYTORCH_CPU_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu/}
        TORCH_VERSION: ${SF_TORCH_VERSION:-2.11.0+cpu}
    restart: unless-stopped
    environment:
      RERANK_MODEL: ${SF_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_USE_FP16: ${SF_RERANK_USE_FP16:-false}
      RERANK_MODEL_LOAD_RETRIES: ${SF_RERANK_MODEL_LOAD_RETRIES:-10}
      RERANK_MODEL_LOAD_RETRY_DELAY: ${SF_RERANK_MODEL_LOAD_RETRY_DELAY:-15}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: /models/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-600}
      HF_HUB_ETAG_TIMEOUT: ${HF_HUB_ETAG_TIMEOUT:-60}
    volumes:
      - reranker_models:/models/huggingface
    networks:
      - synapseflow-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8012/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 20m
    logging: *default-logging

  backend:
    image: synapseflow-backend:prod
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        UV_INDEX_URL: ${SF_UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    restart: unless-stopped
    environment: &backend-env
      ENV: ${SF_ENV:-production}
      DEBUG: ${SF_DEBUG:-false}
      SECRET_KEY: ${SF_SECRET_KEY:?set SF_SECRET_KEY}
      CORS_ORIGINS: ${SF_CORS_ORIGINS:?set SF_CORS_ORIGINS}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synapseflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synapseflow}
      REDIS_URL: redis://redis:6379/0
      DRAMATIQ_INDEXING_QUEUE: ${SF_DRAMATIQ_INDEXING_QUEUE:-indexing}
      EMBEDDING_MODEL: ${SF_EMBEDDING_MODEL:-BAAI/bge-m3}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      MOYU_API_KEY: ${MOYU_API_KEY:?set MOYU_API_KEY}
      RERANK_ENABLED: ${SF_RERANK_ENABLED:-true}
      RERANK_PROVIDER: ${SF_RERANK_PROVIDER:-local}
      RERANK_TOP_K: ${SF_RERANK_TOP_K:-}
      RERANK_API_URL: ${SF_RERANK_API_URL:-http://reranker:8012}
      RERANK_API_KEY: ${SF_RERANK_API_KEY:-}
      PREVIEW_DIR: /app/previews
      UPLOAD_DIR: /app/uploads
      LANGSMITH_TRACING: ${SF_LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${SF_LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${SF_LANGSMITH_PROJECT:-}
      LANGSMITH_WORKSPACE_ID: ${SF_LANGSMITH_WORKSPACE_ID:-}
      LOG_LEVEL: ${SF_LOG_LEVEL:-INFO}
      LOG_JSON: ${SF_LOG_JSON:-false}
    ports:
      - ${SF_BIND_HOST:-127.0.0.1}:${SF_BACKEND_PORT:-8000}:8000
    volumes:
      - backend_hf_cache:/app/.cache/huggingface
      - backend_previews:/app/previews
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      reranker:
        condition: service_healthy
    networks:
      - synapseflow-network
    command:
      - sh
      - -c
      - uv run python scripts/init_db.py && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${SF_BACKEND_WORKERS:-4}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *default-logging

  backend-worker:
    image: synapseflow-backend:prod
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        UV_INDEX_URL: ${SF_UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - backend_hf_cache:/app/.cache/huggingface
      - backend_previews:/app/previews
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synapseflow-network
    command:
      - sh
      - -c
      - uv run dramatiq app.workers.indexing_tasks --processes ${SF_DRAMATIQ_PROCESSES:-2} --threads ${SF_DRAMATIQ_THREADS:-2}
    logging: *default-logging

  frontend:
    image: synapseflow-frontend:prod
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${SF_NEXT_PUBLIC_API_URL:-}
        NPM_REGISTRY: ${SF_NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${SF_NEXT_PUBLIC_API_URL:-}
    ports:
      - ${SF_BIND_HOST:-127.0.0.1}:${SF_FRONTEND_PORT:-3000}:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - synapseflow-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000").then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  backend_hf_cache:
  backend_previews:
  backend_uploads:
  reranker_models:

networks:
  synapseflow-network:
    driver: bridge
