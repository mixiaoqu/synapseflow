# Embedding, indexing, and RAG retrieval configuration.
embedding:
  # local uses sentence-transformers; siliconflow uses the online /v1/embeddings API.
  provider: local
  # Model name used to embed queries and document chunks.
  model: BAAI/bge-m3
  # Must match the model output dimension and database vector column dimension.
  dim: 1024
  # Runtime device, for example cpu or cuda.
  device: cpu
  # Internal encode batch size for one embedding call.
  batch_size: 24
  description: Multilingual embedding model for semantic retrieval.

indexing_batch:
  # Maximum documents in a single dynamic indexing batch.
  max_docs: 4
  # Maximum chunks in a single dynamic indexing batch.
  max_chunks: 128
  # Maximum source text characters in a single dynamic indexing batch.
  max_chars: 100000

chunk:
  # Target maximum characters per chunk.
  size: 700
  # Overlap characters between adjacent chunks.
  overlap: 100
  # Minimum and maximum parent chunk size used by structured section planning.
  parent_target_min: 1200
  parent_target_max: 2500
  # Minimum and maximum child chunk size used by structured section planning.
  child_target_min: 400
  child_target_max: 900
  # Number of split units retained as overlap when one block is split.
  split_overlap_units: 1
  # Maximum parent content size returned during retrieval window expansion.
  parent_window_max_chars: 1800
  # Number of adjacent child chunks included on each side of a hit.
  parent_window_neighbor_span: 1

retrieval:
  # Candidate count fetched from dense or hybrid retrieval.
  k_first: 32
  # Whether to fuse dense vector retrieval with lexical search.
  hybrid_enabled: true
  # Maximum candidates fetched from the lexical search channel.
  lexical_k: 32
  # Reciprocal rank fusion smoothing constant.
  rrf_k: 60
  # Maximum merged candidates allowed into rerank.
  hybrid_pool_limit: 64
  # Vector distance threshold. Smaller distance means higher similarity.
  distance_threshold: 0.5
  # Minimum RRF fusion score to keep. null disables RRF score filtering.
  rrf_score_threshold: 0.012
  # Minimum rerank score to keep. null disables rerank score filtering.
  rerank_threshold: null
  # Maximum retrieval results returned to application logic.
  final_top_k: 16
  # Maximum reference chunks sent into the LLM prompt.
  llm_reference_top_k: 10
  # Maximum prompt context characters assembled from KB chunks.
  kb_context_max_chars: 16000
  # Workflow-level retrieval profiles selected by analyze nodes.
  profiles:
    fast:
      recall_k: 18
      lexical_k: 12
      graph_limit: 6
      final_top_k: 8
      llm_reference_top_k: 8
      context_budget: 8000
      rerank_enabled: true
    standard:
      recall_k: 40
      lexical_k: 28
      graph_limit: 10
      final_top_k: 12
      llm_reference_top_k: 12
      context_budget: 14000
      rerank_enabled: true
    broad:
      recall_k: 64
      lexical_k: 40
      graph_limit: 16
      final_top_k: 18
      llm_reference_top_k: 18
      context_budget: 22000
      rerank_enabled: true
