providers:
  deepseek:
    api_base: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    description: DeepSeek official OpenAI-compatible API

  siliconflow:
    api_base: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    description: SiliconFlow OpenAI compatible API


model_assets:
  # Optional estimated prices in CNY per one million tokens.
  # Keep them at 0/omit them when the provider price is not confirmed.
  deepseek-v4-flash:
    type: chat
    provider: deepseek
    model: deepseek-v4-flash
    name:  DeepSeek V4 Flash
    input_price: 1
    output_price: 2
    request_timeout: 180
    streaming: true
    max_tokens: 4096

    
  # deepseek-v4-flash:
  #   type: chat
  #   provider: siliconflow
  #   model: deepseek-ai/DeepSeek-V4-Flash
  #   name:  DeepSeek V4 Flash
  #   request_timeout: 180
  #   streaming: true
  #   max_tokens: 4096

  deepseek-v4-pro:
    type: chat
    provider: deepseek
    model: deepseek-v4-pro
    name:  DeepSeek V4 pro
    # 官方美元价格按 1 USD = 6.8 CNY 换算；输入采用缓存未命中价格。
    input_price: 3
    output_price: 6
    request_timeout: 180
    streaming: true
    max_tokens: 4096

system_roles:
  planner: deepseek-v4-flash
  analysis: deepseek-v4-flash
  generation: deepseek-v4-flash
  tool: deepseek-v4-flash
