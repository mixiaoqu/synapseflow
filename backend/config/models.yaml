# LLM模型配置文件
# 模型按能力分为5类：planner | analysis | generation | tool | rerank（embedding 见 config/embedding.yaml）

# API密钥环境变量映射
api_keys:
  deepseek: DEEPSEEK_API_KEY
  kimi: KIMI_API_KEY
  siliconflow: SILICONFLOW_API_KEY
  modelscope: MODELSCOPE_API_KEY
  aihubmix: AIHUBMIX_API_KEY
  openrouter: OPENROUTER_API_KEY
  dashscope: DASHSCOPE_API_KEY
  moyu: MOYU_API_KEY

# Provider配置
providers:
  deepseek:
    api_base: https://api.deepseek.com/v1
    description: Deepseek官方API，推理速度快，成本低
  kimi:
    api_base: https://api.moonshot.cn/v1
    description: Kimi官方API，支持128K长上下文
  siliconflow:
    api_base: https://api.siliconflow.cn/v1
    description: SiliconFlow多模型代理平台
  modelscope:
    api_base: https://api-inference.modelscope.cn/v1
    description: ModelScope阿里云平台
  aihubmix:
    api_base: https://aihubmix.com/v1
    description: AIHubMix 多模型代理，kimi-for-coding-free 等
  openrouter:
    api_base: https://openrouter.ai/api/v1
    description: OpenRouter 多模型代理，stepfun/step-3.5-flash:free 等
  dashscope:
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    description: 阿里云通义千问 DashScope,qwen3.5-plus 等
  moyu:
    api_base: https://www.moyu.info/v1
    description: 魔芋（moyu.info）OpenAI 兼容代理，GPT-5.1 等

# 模型配置（5类）
models:
  # 1. planner - 规划任务：设计组件架构、选择方案、拆解步骤
  planner:
    provider: moyu
    model: deepseek-v3
    name: 规划任务模型
    temperature: 0.4
    request_timeout: 90
    streaming: true
    tasks:
      - 设计HTML组件架构
      - 选择设计系统配色
      - 拆解任务步骤

  # 2. analysis - 分析理解：长文本理解、结构化提取、质量评估、内容检测
  analysis:
    provider: moyu
    model: deepseek-v3
    name: 分析理解模型
    temperature: 0.3
    request_timeout: 180
    streaming: true
    tasks:
      - 理解用户复杂问题
      - 提取文档结构和需求
      - 评估答案质量
      - 检测逻辑遗漏

  # 3. generation - 生成内容：文本、代码、修订内容
  generation:
    provider: moyu
    model: deepseek-v3
    name: 魔芋 GPT-5.1 生成
    temperature: 0.5
    request_timeout: 180
    streaming: true
    tasks:
      - 生成详细答案
      - 生成文档补充内容
      - 生成HTML/CSS/JS代码

  # 4. tool - 调用工具：函数调用、API调用、工具选择
  tool:
    provider: moyu
    model: deepseek-v3
    name: 工具调用模型
    temperature: 0.2
    request_timeout: 60
    streaming: false
    tasks:
      - 函数/工具选择
      - API调用决策

  # 5. rerank - 排序：检索结果重排序
  rerank:
    provider: siliconflow
    model: BAAI/bge-reranker-base
    name: 重排序模型
    request_timeout: 30
    tasks:
      - 检索结果精排
