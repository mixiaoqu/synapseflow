[project]
name = "synapseflow-backend"
version = "0.1.0"
description = "SynapseFlow - LangGraph Multi-Agent System Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=1.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "sse-starlette>=2.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.0.0",
    "sentence-transformers>=2.3.0",
    "torch>=2.2.0",
    "transformers>=4.36.0",
    "loguru>=0.7.0",
    "langsmith>=0.1.0",
    "langgraph-cli[inmem]>=0.1.0",
    "langsmith-fetch>=0.3.1",
    "dramatiq[redis]>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

# CPU 版 PyTorch，避免解析出 nvidia-cu12 等大体积 CUDA 依赖（Docker/无 GPU 服务器）
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
