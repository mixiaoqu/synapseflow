x-backend-test-image: &backend-test-image
  image: synapseflow-backend:test
  build:
    context: ./backend
    dockerfile: ../docker/backend/Dockerfile
    args:
      UV_INDEX_URL: ${SF_UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
      PYTORCH_CPU_FIND_LINKS: ${SF_PYTORCH_CPU_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu/}

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: synapseflow-postgres-test
    restart: unless-stopped
    env_file:
      - .env.test
    ports:
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: synapseflow-redis-test
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j-test:
    image: neo4j:5-community
    container_name: synapseflow-neo4j-test
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-this-test-graph-password}
    ports:
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_NEO4J_HTTP_PORT:-7475}:7474"
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:7474 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend-test:
    <<: *backend-test-image
    container_name: synapseflow-backend-test
    restart: unless-stopped
    environment: &backend-test-env
      ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synapseflow_test}:${POSTGRES_PASSWORD:-change-this-test-db-password}@postgres-test:5432/${POSTGRES_DB:-synapseflow_test}
      REDIS_URL: redis://redis-test:6379/0
      DRAMATIQ_INDEXING_QUEUE: ${SF_DRAMATIQ_INDEXING_QUEUE:-indexing}
      DRAMATIQ_GRAPH_INDEXING_QUEUE: ${SF_DRAMATIQ_GRAPH_INDEXING_QUEUE:-graph_indexing}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      MOYU_API_KEY: ${MOYU_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      EMBEDDING_PROVIDER: ${SF_EMBEDDING_PROVIDER:-siliconflow}
      EMBEDDING_API_URL: ${SF_EMBEDDING_API_URL:-https://api.siliconflow.cn/v1/embeddings}
      EMBEDDING_MODEL: ${SF_EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${SF_EMBEDDING_DIMENSIONS:-}
      GRAPH_ENABLED: "true"
      GRAPH_INDEXING_ENABLED: "true"
      GRAPH_URI: bolt://neo4j-test:7687
      GRAPH_USERNAME: neo4j
      GRAPH_PASSWORD: ${NEO4J_PASSWORD:-change-this-test-graph-password}
      GRAPH_DATABASE: neo4j
      DOCUMENT_STAGING_DIR: /app/uploaded_documents/staging
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: /app/.cache/huggingface
      LOG_LEVEL: ${SF_LOG_LEVEL:-INFO}
    ports:
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_test_hf_cache:/app/.cache/huggingface
      - backend_test_previews:/app/previews
      - backend_test_uploads:/app/uploads
      - ./backend/uploaded_documents:/app/uploaded_documents
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  backend-worker-indexing-test:
    <<: *backend-test-image
    container_name: synapseflow-backend-worker-indexing-test
    restart: unless-stopped
    environment: *backend-test-env
    volumes:
      - backend_test_hf_cache:/app/.cache/huggingface
      - backend_test_previews:/app/previews
      - backend_test_uploads:/app/uploads
      - ./backend/uploaded_documents:/app/uploaded_documents
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command:
      - sh
      - -c
      - uv run dramatiq --queues ${SF_DRAMATIQ_INDEXING_QUEUE:-indexing} --processes ${SF_DRAMATIQ_INDEXING_PROCESSES:-1} --threads ${SF_DRAMATIQ_INDEXING_THREADS:-2} app.workers.indexing_tasks

  backend-worker-graph-indexing-test:
    <<: *backend-test-image
    container_name: synapseflow-backend-worker-graph-indexing-test
    restart: unless-stopped
    environment: *backend-test-env
    volumes:
      - backend_test_hf_cache:/app/.cache/huggingface
      - backend_test_previews:/app/previews
      - backend_test_uploads:/app/uploads
      - ./backend/uploaded_documents:/app/uploaded_documents
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy
    command:
      - sh
      - -c
      - uv run dramatiq --queues ${SF_DRAMATIQ_GRAPH_INDEXING_QUEUE:-graph_indexing} --processes ${SF_DRAMATIQ_GRAPH_PROCESSES:-1} --threads ${SF_DRAMATIQ_GRAPH_THREADS:-1} app.workers.indexing_tasks

volumes:
  postgres_test_data:
  redis_test_data:
  neo4j_test_data:
  backend_test_hf_cache:
  backend_test_previews:
  backend_test_uploads:
