services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: synapseflow-postgres-test
    restart: unless-stopped
    env_file:
      - .env.test
    ports:
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: synapseflow-redis-test
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j-test:
    image: neo4j:5-community
    container_name: synapseflow-neo4j-test
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-this-test-graph-password}
    ports:
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_NEO4J_HTTP_PORT:-7475}:7474"
      - "${SF_TEST_BIND_HOST:-127.0.0.1}:${SF_TEST_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:7474 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_test_data:
  redis_test_data:
  neo4j_test_data:
